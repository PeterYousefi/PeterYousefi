<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peter Yousefi — Backend and Cloud Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d1c"/>
      <stop offset="0.55" stop-color="#171029"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a1c3a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2a1c3a" stop-opacity="0"/>
    </radialGradient>
    <path id="petal" d="M0 -6 C3.6 -3 3.6 3 0 6 C-3.6 3 -3.6 -3 0 -6 Z"/>
    <g id="blossom">
      <use href="#petal" transform="rotate(0)   scale(0.9)" fill="#f5b9d0"/>
      <use href="#petal" transform="rotate(72)  scale(0.9)" fill="#f2acc8"/>
      <use href="#petal" transform="rotate(144) scale(0.9)" fill="#f5b9d0"/>
      <use href="#petal" transform="rotate(216) scale(0.9)" fill="#f2acc8"/>
      <use href="#petal" transform="rotate(288) scale(0.9)" fill="#f5b9d0"/>
      <circle r="1.7" fill="#ffe08a"/>
    </g>
  </defs>

  <rect width="1000" height="250" fill="url(#bg)"/>
  <rect width="1000" height="250" fill="url(#glow)"/>
  <rect x="0" y="248" width="1000" height="2" fill="#f4a9c6" opacity="0.5"/>

  <!-- faint branch, top-right -->
  <g opacity="0.5" stroke="#4a3a5e" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M1005 18 C900 30 850 55 800 60"/>
    <path d="M905 27 C915 15 935 12 950 8"/>
    <path d="M842 47 C848 34 862 30 872 26"/>
  </g>
  <g opacity="0.9">
    <use href="#blossom" transform="translate(951 8) scale(1.05)"/>
    <use href="#blossom" transform="translate(873 25) scale(0.9)"/>
    <use href="#blossom" transform="translate(806 60) scale(1.15)"/>
    <use href="#blossom" transform="translate(918 44) scale(0.75)"/>
  </g>

  <!-- drifting petals (SMIL so it animates as an <img> on GitHub) -->
  <g transform="translate(820 0)"><g><use href="#petal" fill="#f4b8ce"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-120 300" dur="9s" begin="-1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="240" dur="9s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="9s" begin="-1s" repeatCount="indefinite"/></g></g>

  <g transform="translate(890 0)"><g><use href="#petal" transform="scale(0.8)" fill="#efa6c4"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-90 300" dur="11s" begin="-4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-200" dur="11s" begin="-4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.82;1" dur="11s" begin="-4s" repeatCount="indefinite"/></g></g>

  <g transform="translate(770 0)"><g><use href="#petal" transform="scale(1.1)" fill="#f9cfe0"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-60 300" dur="12.5s" begin="-2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="180" dur="12.5s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="12.5s" begin="-2s" repeatCount="indefinite"/></g></g>

  <g transform="translate(940 0)"><g><use href="#petal" transform="scale(0.9)" fill="#f4b8ce"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-150 300" dur="10s" begin="-6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="260" dur="10s" begin="-6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="10s" begin="-6s" repeatCount="indefinite"/></g></g>

  <g transform="translate(700 0)"><g><use href="#petal" transform="scale(0.7)" fill="#efa6c4"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-40 300" dur="13.5s" begin="-8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-160" dur="13.5s" begin="-8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.85;1" dur="13.5s" begin="-8s" repeatCount="indefinite"/></g></g>

  <g transform="translate(860 0)"><g><use href="#petal" transform="scale(1.0)" fill="#f9cfe0"/>
    <animateTransform attributeName="transform" type="translate" from="0 -30" to="-110 300" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="220" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="8.5s" begin="-3s" repeatCount="indefinite"/></g></g>

  <!-- wordmark -->
  <text x="62" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f6f1f7" letter-spacing="0.5">Peter Yousefi</text>
  <rect x="64" y="132" width="132" height="3" rx="1.5" fill="#f4a9c6"/>
  <text x="64" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbb7d8" letter-spacing="0.4">Backend &amp; Cloud Developer</text>
  <text x="64" y="196" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#8f7ea3" letter-spacing="1">Toronto · UTC−5 · <tspan fill="#8fd6a8">●</tspan> open to cloud roles</text>
</svg>
