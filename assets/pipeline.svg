<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150" role="img" aria-label="Animated pipeline: agent run, validate, human approval, audit log" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="150" rx="12" fill="#0d1117"/>
  <g transform="translate(10,5)">
    <line x1="150" y1="70" x2="190" y2="70" stroke="#30363d" stroke-width="2"/>
    <line x1="320" y1="70" x2="360" y2="70" stroke="#30363d" stroke-width="2"/>
    <line x1="490" y1="70" x2="530" y2="70" stroke="#30363d" stroke-width="2"/>

    <rect x="20" y="30" width="130" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="190" y="30" width="130" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="360" y="30" width="130" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="530" y="30" width="130" height="80" rx="8" fill="#161b22" stroke="#30363d"/>

    <rect x="20" y="30" width="130" height="80" rx="8" fill="#1f6feb" fill-opacity="0.22" stroke="#1f6feb" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.02;0.2;0.25;1" values="0;1;1;0;0"/>
    </rect>
    <rect x="190" y="30" width="130" height="80" rx="8" fill="#1f6feb" fill-opacity="0.22" stroke="#1f6feb" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.45;0.5;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="360" y="30" width="130" height="80" rx="8" fill="#1f6feb" fill-opacity="0.22" stroke="#1f6feb" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.7;0.75;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="530" y="30" width="130" height="80" rx="8" fill="#2ea043" fill-opacity="0.22" stroke="#2ea043" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.97;1" values="0;0;1;1;0"/>
    </rect>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="85" y="66" fill="#e6edf3" font-size="14" font-weight="600">Agent run</text>
      <text x="85" y="86" fill="#8b949e" font-size="11">LLM workflow</text>
      <text x="255" y="66" fill="#e6edf3" font-size="14" font-weight="600">Validate</text>
      <text x="255" y="86" fill="#8b949e" font-size="11">Schema contract</text>
      <text x="425" y="66" fill="#e6edf3" font-size="14" font-weight="600">Human approval</text>
      <text x="425" y="86" fill="#8b949e" font-size="11">Approve or reject</text>
      <text x="595" y="66" fill="#e6edf3" font-size="14" font-weight="600">Audit log</text>
      <text x="595" y="86" fill="#8b949e" font-size="11">Append-only trail</text>
    </g>

    <circle cy="124" r="4" fill="#58a6ff" cx="85">
      <animate attributeName="cx" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="85;255;425;595;595"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.9;1" values="1;1;0"/>
    </circle>
  </g>
</svg>
